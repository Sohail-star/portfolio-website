<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="restBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18120C" />
      <stop offset="60%" stop-color="#0F0C08" />
      <stop offset="100%" stop-color="#050402" />
    </linearGradient>
    <radialGradient id="dishPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#restBg)" />
  <rect x="25" y="25" width="750" height="400" rx="16" fill="#1C160F" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Restaurant Header -->
  <text x="60" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#F59E0B" letter-spacing="1">GUSTO ARTISAN BISTRO</text>
  <text x="440" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#D1D5DB">Menu · Story · Reservations · Contact</text>

  <!-- Hero Content -->
  <text x="60" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F59E0B" letter-spacing="2">GOURMET DINING EXPERIENCE</text>
  <text x="60" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="36" fill="#FFFFFF">Taste the Passion in Every Bite</text>
  <text x="60" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#9CA3AF">Crafted with farm-fresh organic ingredients, exceptional spice blends, and authentic culinary heritage.</text>

  <rect x="60" y="265" width="130" height="38" rx="8" fill="#D97706" />
  <text x="125" y="289" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Book a Table →</text>
  
  <rect x="205" y="265" width="120" height="38" rx="8" fill="#292117" stroke="#F59E0B" stroke-width="1" />
  <text x="265" y="289" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FDE68A" text-anchor="middle">View Menu</text>

  <!-- Delicious Dish Illustration on right -->
  <circle cx="610" cy="230" r="130" fill="#120D08" stroke="#374151" stroke-width="3" />
  <circle cx="610" cy="230" r="110" fill="url(#dishPlate)" />
  <circle cx="610" cy="230" r="85" fill="#451A03" />
  
  <!-- Food garnish -->
  <circle cx="585" cy="210" r="28" fill="#B45309" />
  <circle cx="635" cy="225" r="24" fill="#D97706" />
  <circle cx="600" cy="250" r="22" fill="#92400E" />
  <!-- Herb leaves -->
  <path d="M605 185 Q620 170 635 185 Q620 200 605 185 Z" fill="#16A34A" />
  <path d="M570 240 Q585 225 600 240 Q585 255 570 240 Z" fill="#22C55E" />
  <circle cx="640" cy="200" r="6" fill="#EF4444" />
  <circle cx="590" cy="270" r="5" fill="#EF4444" />
</svg>
