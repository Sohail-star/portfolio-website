<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#todoBg)" />
  <rect x="140" y="30" width="520" height="390" rx="16" fill="#F8FAFC" stroke="#008CFF" stroke-opacity="0.3" stroke-width="2" />

  <text x="180" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0F172A">My Todo List</text>
  <text x="180" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748B">3 of 5 tasks completed · Productive day!</text>

  <!-- Input Field -->
