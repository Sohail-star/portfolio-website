<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF" />
      <stop offset="50%" stop-color="#008CFF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#008CFF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Tech Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#06162D" stroke="url(#logoGrad)" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Subtle grid / circuit lines inside -->
  <path d="M6 30 H94 M6 70 H94" stroke="#008CFF" stroke-width="0.8" stroke-opacity="0.2"/>
  <path d="M30 6 V94 M70 6 V94" stroke="#008CFF" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Stylized Geometric "M" & "S" Monogram with Code Bracket Angle -->
  <!-- Left Pillar of M -->
  <path d="M26 70 V32 L40 50 L50 38 L60 50 L74 32 V70" 
        stroke="url(#logoGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Modern S Curve Overlay -->
  <path d="M66 52 C66 43 54 43 50 48 C46 53 34 53 34 62 C34 71 52 71 62 67" 
        stroke="#00CFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.95"/>

  <!-- Tech Dots / Nodes -->
  <circle cx="26" cy="32" r="3.5" fill="#00CFFF"/>
  <circle cx="74" cy="32" r="3.5" fill="#00CFFF"/>
  <circle cx="50" cy="38" r="3" fill="#FFFFFF"/>
</svg>
